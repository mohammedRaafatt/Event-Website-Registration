server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Inside Docker, default absolute redirects use port 80; browsers map host:8080 → wrong Location.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / {
        return 302 /pages/index.html;
    }

    location = /index.html {
        return 302 /pages/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
